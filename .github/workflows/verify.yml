name: Verify site
on:
  push:
    branches: [main, codex/recruitment-upgrade]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build all languages and offline editions
        run: python3 scripts/build.py --out-dir dist --offline-dir artifacts/offline
      - name: Verify data, content, and links
        run: python3 scripts/verify.py --site-dir dist --offline-dir artifacts/offline
      - name: Check expansion fixtures independently
        run: python3 tests/check_expansion.py
      - name: Test planner and build safety
        run: node --test tests/*.test.mjs
      - name: Check published files match source
        run: |
          python3 scripts/sync_root.py --site-dir dist
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
