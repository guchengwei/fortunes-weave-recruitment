":"综合比较加入时机与支援培养；同样合适时，优先让四条路线人数接近。","productNote":"逐人将名声要求与支援等级相乘，再相加，重点避开同时“加入晚、支援高”的选择。免费人物的支援为 0，因此乘积为 0，但加入指数仍计名声 2。","gateNote":"同线两人要求名声 5、8：逐人加入指数计 13，但这条路线只需达到 8。此目标只累计四线各自的最高要求，用于比较路线推进程度。","arrival":"加入早晚指数","supportMetric":"支援培养负担","headcount":"四线招募人数","covered":"已安排收集","arrivalTip":"所选招募人物的名声要求逐人相加（原 R）。越低代表整体名声要求越低，通常能更早加入、留出更多培养时间；不是实际章节或天数。免费招募也计名声 2。剧情加入时点未知，不纳入该指数。","supportTip":"所选招募人物的支援等级相加（原 S）。越低通常越省培养支援的功夫，不是礼物数量、金币或精确耗时；尚未模拟存档继承。免费与剧情加入的额外支援记为 0。","headcountTip":"包含主动招募与免费招募，不含剧情加入。顺序固定为凯伊、迪托利希、赛奥朵拉、蕾达。","coveredTip":"仅统计条件表中的 50 人，不代表游戏全部可用角色。默认四线各玩一次，每人至少加入一次；严格招募口径要求其中可挖角的44人实际招募。","tradeoff":"加入时机 × 支援培养","chartHint":"越靠左下，加入要求与支援负担越低。选择圆点或方案卡，即可查看对应名单。","xArrival":"加入早晚指数 ← 越低越早","ySupport":"支援培养负担 ↓ 越低越省力","xGate":"四线推进门槛合计 ← 越低越好","frontTip":"这些方案不能同时在加入时机与支援负担上继续改善（帕累托前沿）。不同偏好对应不同选择。","midPlan":"折中方案","arrivalShort":"加入指数","supportShort":"支援负担","gateShort":"推进","distribution":"需要等到多高名声？","distributionNote":"人数按所需名声分组，包含免费招募。","renown":"名声","supportLevel":"支援等级","people":"人","story":"剧情加入","free":"免费招募","recruit":"主动招募","no":"不可挖角","none":"无","routeNote":"剧情与免费加入列在前面；主动招募按本路线的名声要求排序，再按支援等级排序。","maxGate":"需达到名声","rosterNote":"按阵营查看主要角色，再查看其他同伴。✓ 表示当前方案安排；悬停或点击 ⓘ 可查看说明。","search":"搜索任一语言的姓名","character":"人物","others":"其他同伴","faction":"阵营","storyInfo":"剧情自动加入，不增加招募费用。未标明章节时，不代表开局加入。","freeInfo":"免费不等于开局加入：仍需名声 2。加入早晚指数计 2，额外支援培养记 0。","extraInfo":"名声与支援只是表内条件；还可能需要任务、外传、交涉、道具或剧情进度。此计划未计入这些额外成本。","gaitzInfo":"盖茨还需要外传及剧情进度；并非名声 10、支援 3 达成后立即就能加入。","fabioInfo":"蕾达线的法毕欧还有外传、剧情进度及交涉道具要求。","info":"说明","rules":"计算方式与适用范围","rulesBody":"以表内名声与支援要求作比较：普通与免费招募都计名声，剧情人物的加入时点未知，暂不计入加入指数。支援等级按人相加。默认通过剧情获取的人不重复招募来凑人数。优化是对这些指标的精确比较，不是实际时间或金币预算。","methods":"折中：加入指数 + 支援重视程度 × 支援负担。进阶乘积：逐人名声 × 支援后相加。推进门槛：每线只取最高名声（至少 2），再加权支援。","sourceInfo":"条件与头像来自 2026-09-22 条件表；中文姓名沿用原表，英文姓名参考 RPG Site，日文姓名参考 AppMedia。按阵营排列是便于阅读的编辑顺序，不宣称为游戏内官方名册顺序。","footer":"50 位同伴 · 4 条路线 · 中文 / 日本語 / English · 可离线使用","limitsAdvanced":"此进阶模型暂不约束人数；主目标可使用人数均衡选项。","strictBalance":"严格招募口径暂不约束人数。","selectedCounts":"人数分配","objectiveValue":"当前目标的比较值","manualChoose":"选择此方案","all50":"50 人全部已安排","strict44":"44 人实际招募 + 6 人剧情加入","constraint":"当前人数条件","lower":"越低越好","nameNote":"名称对照","extraCostNote":"金币、道具与任务未计入方案评分；名声仅近似加入早晚，实际还受出现日期与剧情进度影响。","extraSource":"附加条件参考：RPG Site 招募攻略（2026-09-22 核对）。"},"ja":{"title":"4ルート全員加入プラン","subtitle":"加入の早さと支援育成の手間を比べ、仲間ごとにルートを選びます。","plan":"プランを選ぶ","allocation":"ルート別メンバー","roster":"全キャラクターと条件","language":"言語","goal":"何を優先する？","early":"早期加入を優先","support":"支援育成の手間を抑える","compromise":"バランス重視","product":"詳細：遅い加入と高支援を避ける","gate":"詳細：必要な名声の到達度を抑える","custom":"選択したプラン","coverage":"収集の目標","inclusive":"ストーリー加入も含む（全50人）","strict":"スカウト可能な44人を一度ずつ勧誘","balance":"ルート別の人数","unlimited":"人数制限なし","even":"均等に配分：各ルート8人","spread2":"人数差は最大2人","weight":"支援育成を重視する度合い","restore":"優先項目のおすすめに戻す","selected":"選択中","recommended":"おすすめ","customNote":"プランを手動で選択しました。優先項目は「選択したプラン」に切り替わりました。","earlyNote":"現在の人数条件で必要名声の合計を最小化し、同点なら支援の合計を抑えます。","supportNote":"現在の人数条件で必要支援Lvの合計を最小化し、同点なら必要名声を抑えます。","compromiseNote":"加入時期と支援育成の両方を比較し、同点ならルート間の人数差を抑えます。","productNote":"各キャラの必要名声と支援Lvを掛けて合計し、両方が高い組み合わせを避けます。無料加入は支援0のため積は0ですが、加入指数には名声2を含めます。","gateNote":"同ルートの2人が名声5・8を必要とする場合、加入指数は13、到達すべき名声は8です。この目標は各ルートの最高値を合計します。","arrival":"加入時期の指数","supportMetric":"支援育成の手間","headcount":"ルート別スカウト人数","covered":"加入プラン作成済み","arrivalTip":"勧誘するキャラの必要名声を合計します（旧R）。低いほど全体の名声条件が低く、早期育成を始めやすい目安です。章数や日数ではありません。無料加入は名声2を含み、時期不明のストーリー加入は集計外です。","supportTip":"必要支援Lvの合計です（旧S）。低いほど支援を育てる手間が少ない目安ですが、贈り物の数・金額・正確な時間ではありません。引き継ぎは未考慮。無料・ストーリー加入は支援0として扱います。","headcountTip":"スカウトと無料加入を含み、ストーリー加入は除きます。順番はカイ、ディートリヒ、セオドラ、レダです。","coveredTip":"対象は条件表の50人で、ゲーム全体の全キャラではありません。4ルートを一度ずつ遊び、各キャラを一度加入させます。厳密な勧誘では44人を実際にスカウトします。","tradeoff":"加入時期 × 支援育成","chartHint":"左下ほど必要名声と支援負担が低くなります。点やプランを選ぶと編成が切り替わります。","xArrival":"加入指数 ← 低いほど早い","ySupport":"支援育成の手間 ↓ 少ないほど楽","xGate":"4ルートの必要名声合計 ← 低いほど良い","frontTip":"加入時期と支援の両方を同時には改善できないプランです（パレート最適）。優先するものによって選択が変わります。","midPlan":"中間プラン","arrivalShort":"加入指数","supportShort":"支援負担","gateShort":"到達名声","distribution":"どの名声で加入できる？","distributionNote":"無料加入を含め、必要名声ごとに人数を表示。","renown":"名声","supportLevel":"支援Lv","people":"人","story":"ストーリー加入","free":"無料加入","recruit":"スカウト","no":"勧誘不可","none":"なし","routeNote":"ストーリー・無料加入の後にスカウトを表示。当該ルートの必要名声、支援レベルの順に並びます。","maxGate":"必要名声の最高値","rosterNote":"主要キャラを陣営別に、続いて他の仲間を表示します。✓は選択中の加入ルート。ⓘで補足を確認できます。","search":"どの言語の名前でも検索","character":"キャラクター","others":"その他の仲間","faction":"陣営","storyInfo":"ストーリー進行で加入し、追加の勧誘コストは0です。加入時期は表に揃っておらず、最初から加入するとは限りません。","freeInfo":"無料でも最初から加入するとは限りません。名声2が必要です。加入指数は2、支援の手間は0として計算します。","extraInfo":"名声と支援以外に、クエスト・外伝・交渉・アイテム・進行度が必要な場合があります。その追加コストは含みません。","gaitzInfo":"ゲイツには外伝とストーリー進行の条件もあります。名声10・支援3だけで即加入するとは限りません。","fabioInfo":"レダ編のファビオには外伝・進行度・交渉アイテムの条件もあります。","info":"補足","rules":"計算方法と対象範囲","rulesBody":"表の名声と支援条件を比較します。通常・無料加入ともに名声を計上し、時期不明のストーリー加入は加入指数に含めません。支援Lvは人数分を合計します。ストーリーで加入するキャラを人数調整のために重複勧誘しません。これらの指標で最適化しており、実時間や金額の予算ではありません。","methods":"バランス：加入指数＋支援の重み×支援合計。積の比較：各キャラの名声×支援を合計。到達度：各ルートの名声最大値（最低2）を合計し、支援を加重。","sourceInfo":"条件と画像は2026-09-22の条件表に基づきます。中国語名は原表、英語名はRPG Site、日本語名はAppMediaを参照。陣営順は読みやすさのための編集順で、公式の名簿順ではありません。","footer":"仲間50人 · 4ルート · 中文 / 日本語 / English · オフライン対応","limitsAdvanced":"この詳細モデルでは人数制限を設けません。基本の目標では均等配分を選べます。","strictBalance":"厳密な勧誘モードでは人数制限を設けません。","selectedCounts":"人数配分","objectiveValue":"現在の目標の比較値","manualChoose":"このプランを選択","all50":"全50人の加入プラン","strict44":"44人を勧誘＋6人はストーリー加入","constraint":"現在の人数条件","lower":"低いほど良い","nameNote":"名前の対照","extraCostNote":"資金・アイテム・クエストは評価に含みません。名声は加入時期の目安で、出現日や物語の進行にも左右されます。","extraSource":"追加条件：RPG Site の加入攻略を参照（2026-09-22 確認）。"},"en":{"title":"Four-route recruitment planner","subtitle":"Find a route for every companion by comparing earlier recruitment with support training effort.","plan":"Choose a plan","allocation":"Route rosters","roster":"All characters & requirements","language":"Language","goal":"What matters most?","early":"Recruit earlier","support":"Less support training","compromise":"Balance both","product":"Advanced: avoid late, demanding recruits","gate":"Advanced: lower route progression","custom":"Custom selection","coverage":"Collection goal","inclusive":"Include story joins (all 50)","strict":"Actually recruit all 44 eligible characters","balance":"Recruits per route","unlimited":"No headcount limit","even":"Exactly even: 8 per route","spread2":"At most 2 apart","weight":"Weight on support effort","restore":"Restore recommendation","selected":"Selected","recommended":"Recommended","customNote":"You selected a plan manually. The goal now shows “Custom selection”.","earlyNote":"Minimize total recruitment renown under the headcount limit, then minimize support effort on ties.","supportNote":"Minimize total support levels under the headcount limit, then favor earlier recruitment on ties.","compromiseNote":"Weigh recruitment timing against support training, favoring even headcounts on ties.","productNote":"Multiply renown by support for each recruit, then sum, to avoid choices high in both. Free recruits contribute zero to the product but still add renown 2 to the timing index.","gateNote":"Two recruits on one route need renown 5 and 8: their timing index totals 13, but that route only needs to reach 8. This goal sums the highest threshold on each route.","arrival":"Recruitment timing index","supportMetric":"Support training effort","headcount":"Recruits across routes","covered":"Characters covered","arrivalTip":"Sum of renown requirements for selected recruits (formerly R). Lower thresholds generally allow earlier training; this is not a chapter or day count. Free recruits count as 2. Story joins lack timing data and are excluded.","supportTip":"Sum of required support levels (formerly S). A proxy for effort, not gifts, gold or exact time; save carryover is not modeled. Free and story joins add no support requirement.","headcountTip":"Counts active and free recruits, excluding story joins. Order: Cai, Dietrich, Theodora, Leda.","coveredTip":"Covers the 50 char const $=id=>document.getElementById(id),colors=['#4176a8','#8869af','#9b7e28','#b64d6b'];
const state={lang:'zh',goal:'compromise',pref:'compromise',scope:'inclusive',balance:'cost',weight:1,selected:null,search:''};
const t=k=>I[state.lang][k],name=n=>NAMES[n][state.lang],fmt=v=>Math.round(v*100)/100;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const order=(a,b)=>NAMES[a.name||a].rank-NAMES[b.name||b].rank;
const allNames=[...D.characters].sort(order),extra=D.characters.filter(n=>!D.targets.includes(n)).map(n=>D.rows.find(x=>x.name===n&&x.status==='story'));
const key=p=>`${p.r}/${p.s}`;
let pool=[],front=[],current=null;
function avatar(n){return `<img class="portrait" src="${PORTRAITS[n]}" width="48" height="40" alt="" data-character="${esc(n)}">`}
function info(text){return `<button class="info" type="button" data-tip="${esc(text)}" aria-label="${esc(t('info'))}">ⓘ</button>`}
function nameInfo(n){return `${t('nameNote')}\n${NAMES[n].zh} · ${NAMES[n].ja} · ${NAMES[n].en}`}
function counts(p){return D.routes.map(r=>p.assignment.filter(x=>x.route===r&&x.status!=='story').length)}
function delta(p){let a=counts(p);return Math.max(...a)-Math.min(...a)}
function timing(p){return p.assignment.reduce((s,x)=>s+(x.status==='story'?0:x.renown),0)}
function value(p,goal=state.pref){return goal==='early'?p.r:goal==='support'?p.s:goal==='product'?p.value:p.r+state.weight*p.s}
function best(arr,goal=state.pref){let keys=p=>goal==='early'?[p.r,p.s,delta(p)]:goal==='support'?[p.s,p.r,delta(p)]:[value(p,goal),delta(p),p.s];return [...arr].sort((a,b)=>{let x=keys(a),y=keys(b);for(let i=0;i<x.length;i++){if(Math.abs(x[i]-y[i])>1e-8)return x[i]-y[i]}return 0})[0]}
function basePool(){let r=RESULTS[state.scope];if(state.scope==='inclusive')return r.balanced_frontier.filter(p=>state.balance==='cost'||p.delta<=Number(state.balance));return r.additive}
function chooseData(){const r=RESULTS[state.scope];pool=state.pref==='gate'?r.threshold:state.pref==='product'?r.additive:basePool();front=pool.filter(p=>!pool.some(q=>q.r<=p.r&&q.s<=p.s&&(q.r<p.r||q.s<p.s))).sort((a,b)=>a.r-b.r);let rec=state.pref==='product'?r.product:best(pool);current=state.selected?front.find(p=>key(p)===state.selected)||rec:rec;return rec}
function options(el,keys){$(el).innerHTML=keys.map(([v,k])=>`<option value="${v}"${v==='custom'?' disabled':''}>${esc(t(k))}</option>`).join('')}
function localize(){document.documentElement.lang=state.lang==='zh'?'zh-CN':state.lang;document.title=t('title');document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));options('goal',['early','support','compromise','product','gate','custom'].map(k=>[k,k]));options('coverage',[['inclusive','inclusive'],['strict','strict']]);options('balance',[['cost','unlimited'],['0','even'],['2','spread2']]);$('language').value=state.lang;$('goal').value=state.goal;$('coverage').value=state.scope;$('balance').value=state.balance;$('search').placeholder=t('search');$('weight').setAttribute('aria-label',t('weight'));$('search').setAttribute('aria-label',t('search'));$('frontInfo').innerHTML=info(t('frontTip'));$('sourceInfo').innerHTML=info(t('sourceInfo'));}
function render(){localize();let rec=chooseData(),p=current,basic=!['product','gate'].includes(state.pref),balanced=state.scope==='inclusive'&&basic;$('balanceLabel').hidden=!balanced;$('weightLabel').hidden=!['compromise','gate'].includes(state.pref);$('weightValue').textContent=fmt(state.weight);$('weight').value=state.weight;$('restore').hidden=state.goal!=='custom';$('constraintHint').textContent=!basic?t('limitsAdvanced'):state.scope==='strict'?t('strictBalance'):'';
 const basicOptions=basePool();$('goalCards').innerHTML=['early','support','compromise'].map(g=>{let q=best(basicOptions,g);return `<button class="goalCard" data-goal="${g}" aria-pressed="${state.goal===g}"><strong>${esc(t(g))}</strong><span>${t('arrivalShort')} ${q.r} · ${t('supportShort')} ${q.s}</span></button>`}).join('');
 $('selectionNote').innerHTML=`<strong>${esc(state.goal==='custom'?t('custom'):t(state.pref))}</strong>${esc(state.goal==='custom'?t('customNote'):t(state.pref+'Note'))}`;
 const a=counts(p),cover=t(state.scope==='inclusive'?'all50':'strict44');
 $('metrics').innerHTML=[['arrival',timing(p),'arrivalTip'],['supportMetric',p.s,'supportTip'],['headcount',a.join(' / '),'headcountTip'],['covered','50 / 50','coveredTip']].map(([label,v,tip])=>`<div class="metric"><div class="label">${t(label)}${info(t(tip))}</div><div class="value ${label==='headcount'?'countvalue':''}">${v}</div>${label==='covered'?`<div class="small muted">${cover}</div>`:''}</div>`).join('');
 drawChart();
 $('legend').innerHTML=`<span><i class="dot"></i>${t('selected')}: ${t(state.pref==='gate'?'gateShort':'arrivalShort')} ${p.r} · ${t('supportShort')} ${p.s}</span>${['compromise','product','gate'].includes(state.pref)?`<span class="muted">${t('objectiveValue')} ${fmt(value(p))}</span>`:''}`;
 $('front').innerHTML=state.pref==='product'?'':front.map((q,i)=>{let label=state.pref==='gate'?`${t('midPlan')} ${i+1}`:i===0?t('early'):i===front.length-1?t('support'):`${t('midPlan')} ${i}`;return `<button class="planCard" data-plan="${key(q)}" aria-pressed="${key(q)===key(p)}"><b>${esc(label)}${key(q)===key(p)?' ✓':''}</b><span>${t(state.pref==='gate'?'gateShort':'arrivalShort')} ${q.r} · ${t('supportShort')} ${q.s}</span><span class="muted">${counts(q).join(' / ')}</span></button>`}).join('');
 const hist=Array.from({length:9},(_,i)=>p.assignment.filter(x=>x.status!=='story'&&x.renown===i+2).length),max=Math.max(...hist,1);
 $('hist').innerHTML=hist.map((n,i)=>`<div class="histitem" role="img" aria-label="${esc(t('renown'))} ${i+2}: ${n} ${esc(t('people'))}"><span class="n">${n}</span><div class="column" style="height:${n/max*135}px"></div><span class="r">${i+2}</span></div>`).join('');renderRoutes();renderTable();
}
function rowTip(x){if(x.status==='no')return t('no');const detail=EXTRAS[x.name]?.[x.route]?.[state.lang];let lines=[name(x.route),x.status==='story'?t('storyInfo'):x.status==='free'?t('freeInfo'):`${t('renown')} ${x.renown} · ${t('supportLevel')} ${x.support}`];if(detail)lines.push(detail);if(x.status==='recruit')lines.push(t('extraCostNote'));if(detail)lines.push(t('extraSource'));return lines.join('\n\n')}

function chip(x){return `<span class="chip">${avatar(x.name)}<span>${esc(name(x.name))}${x.status==='free'?`<small class="muted" style="display:block">${t('renown')} 2</small>`:''}</span>${info(nameInfo(x.name)+'\n'+rowTip(x))}</span>`}
function renderRoutes(){let p=current;$('routes').innerHTML=D.routes.map((r,i)=>{let rows=p.assignment.filter(x=>x.route===r).concat(extra.filter(x=>x.route===r));let s=rows.filter(x=>x.status==='story').sort(order),f=rows.filter(x=>x.status==='free').sort(order),m=rows.filter(x=>x.status==='recruit').sort((a,b)=>a.renown-b.renown||a.support-b.support||order(a,b));return `<article class="route" style="--route:${colors[i]}"><div class="routehead"><h3>${avatar(r)}${esc(name(r))}</h3><span class="routecounts">${t('story')} ${s.length} · ${t('free')} ${f.length} · ${t('recruit')} ${m.length}</span></div><div class="small muted">${t('maxGate')} ${Math.max(2,...m.map(x=>x.renown))} · ${t('supportMetric')} ${m.reduce((v,x)=>v+x.support,0)}</div><div class="group"><h4 class="story">${t('story')}</h4><div class="chips">${s.map(chip).join('')||t('none')}</div></div><div class="group"><h4 class="free">${t('free')}</h4><div class="chips">${f.map(chip).join('')||t('none')}</div></div><div class="group"><h4>${t('recruit')}</h4><ul class="recruitlist">${m.map(x=>`<li>${avatar(x.name)}<div class="details"><strong>${esc(name(x.name))}</strong><div class="conditions">${t('renown')} ${x.renown} · ${t('supportLevel')} ${x.support}</div></div>${info(nameInfo(x.name)+'\n'+rowTip(x))}</li>`).join('')||`<li>${t('none')}</li>`}</ul></div></article>`}).join('')}
function renderTable(){let search=state.search.trim().toLowerCase(),selected=[...current.assignment,...extra],previous=null;$('tableHead').innerHTML=`<tr><th>${t('character')}</th>${D.routes.map(r=>`<th>${esc(name(r))}</th>`).join('')}</tr>`;let out='';allNames.filter(n=>[n,NAMES[n].en,NAMES[n].ja].some(v=>v.toLowerCase().includes(search))).forEach(n=>{let group=NAMES[n].group||'others';if(group!==previous){out+=`<tr class="groupRow"><th colspan="5">${group==='others'?t('others'):esc(name(group))+' · '+t('faction')}</th></tr>`;previous=group}out+=`<tr data-character-row="${esc(n)}"><td><span class="character">${avatar(n)}<span>${esc(name(n))}</span>${info(nameInfo(n))}</span></td>${D.routes.map(r=>{let x=D.rows.find(x=>x.name===n&&x.route===r),sel=selected.some(x=>x.name===n&&x.route===r),label=x.status==='no'?t('no'):x.status==='story'?t('story'):x.status==='free'?`${t('free')} · ${t('renown')} 2`:`${t('renown')} ${x.renown} · ${t('supportLevel')} ${x.support}`;return `<td class="${sel?'cellchosen':''} ${x.status==='no'?'unavailable':x.status}"><div class="celllabel"><span>${sel?'✓ ':''}${esc(label)}</span>${x.status==='no'?'':info(rowTip(x))}</div></td>`}).join('')}</tr>`});$('tableBody').innerHTML=out}
function drawChart(){if(!current)return;const svg=$('chart'),w=svg.clientWidth||600,h=310,left=58,right=w-20,top=34,bottom=252,pts=[...front,current],loR=Math.min(...pts.map(p=>p.r))-1,hiR=Math.max(...pts.map(p=>p.r))+1,loS=Math.min(...pts.map(p=>p.s))-1,hiS=Math.max(...pts.map(p=>p.s))+1,X=v=>left+(v-loR)/(hiR-loR)*(right-left),Y=v=>bottom-(v-loS)/(hiS-loS)*(bottom-top);
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('aria-label',t('tradeoff'));
 let out=`<title>${esc(t('tradeoff'))}</title><desc>${esc(t('chartHint'))}</desc>`;
 for(let i=0;i<4;i++){let x=Math.round(loR+(hiR-loR)*i/3),y=Math.round(loS+(hiS-loS)*i/3);out+=`<line class="grid" x1="${X(x)}" y1="${top}" x2="${X(x)}" y2="${bottom}"/><text x="${X(x)}" y="${bottom+21}" text-anchor="middle">${x}</text><line class="grid" x1="${left}" y1="${Y(y)}" x2="${right}" y2="${Y(y)}"/><text x="${left-10}" y="${Y(y)+4}" text-anchor="end">${y}</text>`}
 out+=`<text x="${left}" y="17">${esc(t('ySupport'))}</text><text x="${w/2}" y="302" text-anchor="middle" style="font-size:${w<420?11:13}px">${esc(t(state.pref==='gate'?'xGate':'xArrival'))}</text><polyline points="${front.map(p=>`${X(p.r)},${Y(p.s)}`).join(' ')}" fill="none" stroke="#8eae99" stroke-width="2"/>`;
 front.forEach(p=>{let sel=key(p)===key(current),label=`${t('manualChoose')}: ${t(state.pref==='gate'?'gateShort':'arrivalShort')} ${p.r}, ${t('supportShort')} ${p.s}`;out+=`<circle class="point" cx="${X(p.r)}" cy="${Y(p.s)}" r="${sel?8:5}" fill="${sel?'#286952':'#a7bfaf'}" stroke="white" stroke-width="2" ${state.pref==='product'?'':`role="button" tabindex="0" data-plan="${key(p)}" aria-label="${esc(label)}" aria-pressed="${sel}"`}><title>${esc(label)}</title></circle>`});
 if(state.pref==='product')out+=`<rect x="${X(current.r)-7}" y="${Y(current.s)-7}" width="14" height="14" fill="#286952"><title>${esc(t('selected'))}</title></rect>`;
 svg.innerHTML=out;
}
function selectGoal(goal){state.goal=goal;state.pref=goal;state.selected=null;render()}
function selectPlan(id){state.selected=id;state.goal='custom';render()}
$('goal').onchange=e=>selectGoal(e.target.value);$('coverage').onchange=e=>{state.scope=e.target.value;state.selected=null;state.goal=state.pref;render()};$('balance').onchange=e=>{state.balance=e.target.value;state.selected=null;state.goal=state.pref;render()};$('language').onchange=e=>{state.lang=e.target.value;hideTip();render()};$('weight').oninput=e=>{state.weight=+e.target.value;state.goal=state.pref;state.selected=null;render()};$('restore').onclick=()=>selectGoal(state.pref);$('search').oninput=e=>{state.search=e.target.value;renderTable()};
document.addEventListener('click',e=>{let g=e.target.closest('[data-goal]'),p=e.target.closest('[data-plan]');if(g)selectGoal(g.dataset.goal);else if(p)selectPlan(p.dataset.plan)});document.addEventListener('keydown',e=>{let p=e.target.closest('[data-plan]');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectPlan(p.dataset.plan)}});
let pinned=null;function hideTip(){pinned=null;$('tooltip').hidden=true;document.querySelectorAll('[aria-describedby="tooltip"]').forEach(e=>e.removeAttribute('aria-describedby'))}function showTip(el){const box=$('tooltip');box.textContent=el.dataset.tip;box.hidden=false;el.setAttribute('aria-describedby','tooltip');const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();box.style.left=Math.max(12,Math.min(innerWidth-b.width-12,r.left))+'px';box.style.top=Math.max(12,Math.min(innerHeight-b.height-12,r.bottom+8))+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el&&!pinned)showTip(el)});document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]')&&!pinned)hideTip()});document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});document.addEventListener('focusout',()=>{if(!pinned)hideTip()});document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el){if(pinned===el)hideTip();else{pinned=el;showTip(el)}}else hideTip()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});window.addEventListener('resize',()=>{hideTip();drawChart()});window.addEventListener('scroll',hideTip,{passive:true});render();
</script></body></html>
